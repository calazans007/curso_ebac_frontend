<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h1>Validação de Números</h1>
        <h6>*NÚMERO DO CAMPO A TEM QUE SER MENOR QUE CAMPO B, CASO CONTRÁRIO O FORMULÁRIO SERÁ INVÁLIDO!*</h6>
    

    <form id="meuFormulario">
        <label for="campoA">Campo A:</label>
        <input type="number" id="campoA" name="campoA" required placeholder="Digite um número"><br><br>

        <label for="campoB">Campo B:</label>
        <input type="number" id="campoB" name="campoB" required placeholder="Digite um número"><br><br>

        <button type="submit">Enviar</button>
        <div id="mensagem"></div>
    </form>
   <script src="./js.js"></script>
</body>
</html>
